repos:
  - repo: https://github.com/nwarila-platform/workflow-template-drift
    rev: f621507b3eaa1d7e8afe89f42b75c653968d2a48 # v2.0.0
    hooks:
      - id: template-drift
      - id: template-drift-sync

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform -chdir=terraform fmt -recursive
        language: system
        pass_filenames: false
        files: ^terraform/.*\.tf$

      - id: terraform-docs
        name: terraform-docs
        entry: make docs
        language: system
        pass_filenames: false
        files: ^terraform/.*\.tf$

      - id: docs-layout
        name: docs layout
        entry: python tools/check_docs_layout.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$|^tools/check_docs_layout.py$
